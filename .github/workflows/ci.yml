name: ci
on:
  push:
    branches: [develop, main, master, "release/*"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke:manager
      - run: node dist/cli.js categorias:list
      - run: node dist/cli.js hunter:buscar --category MLB3937 --q "Orient" --limite 1
