# Configuração Prometheus para Alcance Promo Radar
# Scrapa o endpoint /metrics do manager em http://manager:8091/metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Timezone de São Paulo
  external_labels:
    monitor: 'alcance-promo-radar'
    timezone: 'America/Sao_Paulo'

# Rótulos estáticos aplicados a todos os targets
scrape_configs:
  # Scrape do manager (alcance-promo-radar)
  - job_name: 'alcance-manager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['manager:8091']
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'manager'

  # Health check do próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []